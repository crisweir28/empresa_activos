{# app/templates/administrativo/modales/vehiculo_detalle/_modal_mantenimiento_nuevo.html #}
<div class="overlay" id="modal-mant" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:560px">
    <h2>🔧 Registrar mantenimiento</h2>
    <form method="POST" action="{{ url_for('administrativo.mantenimiento_nuevo', id=vehiculo.IdVehiculo) }}">
      <div class="grid-2">
        <div class="field"><label>Tipo *</label>
          <select name="tipo_servicio_id" required>
            {% for t in tipos %}{% if t.IdCategoria == 1 %}
            <option value="{{ t.IdTipoServicio }}">{{ t.Nombre }}</option>
            {% endif %}{% endfor %}
          </select>
        </div>
        <div class="field"><label>Proveedor / Taller</label>
          <input name="proveedor" placeholder="Nombre del taller">
        </div>
      </div>
      <div class="field"><label>Diagnóstico</label>
        <textarea name="diagnostico" placeholder="Describe el problema..."></textarea>
      </div>
      <div class="field"><label>Descripción del trabajo</label>
        <textarea name="descripcion" placeholder="Describe el trabajo..."></textarea>
      </div>
      <div class="grid-2">
        <div class="field"><label>Fecha inicio *</label><input name="fecha_inicio" type="date" required></div>
        <div class="field"><label>Fecha entrega estimada</label><input name="fecha_entrega" type="date"></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Kilometraje actual</label>
          <input name="kilometraje" type="number" min="0" placeholder="{{ vehiculo.Kilometraje or 0 }}">
        </div>
        <div class="field"><label>Costo estimado ($)</label>
          <input name="costo" type="number" step="0.01" min="0" placeholder="0.00">
        </div>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:14px;margin-top:4px">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Próximo mantenimiento</div>
        <div class="grid-2">
          <div class="field"><label>Próximo km</label><input name="proximo_kilometraje" type="number" min="0"></div>
          <div class="field"><label>Próxima fecha</label><input name="proxima_fecha" type="date"></div>
        </div>
      </div>
      <div class="field"><label>Personal responsable</label>
        <select name="personal_id">
          <option value="">— Sin asignar —</option>
          {% for p in personal %}<option value="{{ p.IdPersonal }}">{{ p.Nombre }} {{ p.Apellido }}</option>{% endfor %}
        </select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-cancel" onclick="cerrarModal('modal-mant')">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>
