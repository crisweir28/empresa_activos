{#app/templates/ti/modales/modal-equipos/_modal_equipo_nuevo.html#}

<style>
  .swal-sobre-modal {
    position: absolute !important;
    z-index: 99999 !important;
  }
  .archivo-preview-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  flex-shrink: 0;
  }

  /* ── Botón agregar más archivos ── */
.archivo-agregar-mas {
  width: 100px;
  height: 90px;
  border: 2px dashed #d1d5db;
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  color: #9ca3af;
}

.archivo-agregar-mas i {
  font-size: 28px;
}

.archivo-agregar-mas:hover {
  border-color: var(--primary, #9B2335);
  color: var(--primary, #9B2335);
  background: rgba(155, 35, 53, 0.04);
}

</style>

<div class="overlay" id="modal-nuevo" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:720px">
    <h2>💻 Nuevo equipo TI</h2>

    <form method="POST" action="{{ url_for('ti.equipo_nuevo') }}" enctype="multipart/form-data" id="form-nuevo-equipo"
      class="necesita-validacion" novalidate>

      <!-- ─── Nombre + Tipo ─────────────────────────────────── -->
      <div class="grid-2">
        <div class="field">
          <label class="requerido">Nombre</label>
          <input name="nombre" required placeholder="Ej: Laptop Dell 01" oninput="vCampo(this,'ti-nombre')"
            onblur="vCampo(this,'ti-nombre')">
          <div class="invalid-tooltip">El nombre es obligatorio.</div>
          <div class="field-msg" id="msg-ti-nombre"></div>
        </div>

        <div class="field">
          <label class="requerido">Tipo</label>
          <select name="tipo_equipo" required id="n-tipo" onchange="actualizarCampos()">
            <option value="">— Selecciona —</option>
            <option value="laptop">💻 Laptop</option>
            <option value="desktop">🖥️ Desktop</option>
            <option value="monitor">🖵 Monitor</option>
            <option value="celular">📱 Celular</option>
            <option value="red">🌐 Red</option>
            <option value="otro">📦 Otro</option>
          </select>
          <div class="invalid-tooltip">Selecciona el tipo de equipo.</div>
        </div>
      </div>

      <!-- ─── Gama + Estado ─────────────────────────────────── -->
      <div class="grid-2">
        <div class="field">
          <label>Gama</label>
          <select name="gama">
            <option value="">— Sin gama —</option>
            <option value="Baja">Baja</option>
            <option value="Media">Media</option>
            <option value="Alta">Alta</option>
            <option value="Gamer">Gamer</option>
          </select>
        </div>
        <div class="field">
          <label>Estado inicial</label>
          <select name="estado">
            <option value="almacen">Nuevo / En almacén</option>
            <option value="asignado">Operativo / Asignado</option>
            <option value="mantenimiento">En reparación</option>
            <option value="baja">Baja</option>
          </select>
        </div>
      </div>

      <!-- ─── Marca + Modelo ────────────────────────────────── -->
      <div class="grid-2">
        <div class="field">
          <label class="requerido">Marca</label>
          <input name="marca" required placeholder="Dell" oninput="vCampo(this,'ti-marca')"
            onblur="vCampo(this,'ti-marca')">
          <div class="invalid-tooltip">La marca es obligatoria.</div>
          <div class="field-msg" id="msg-ti-marca"></div>
        </div>
        <div class="field">
          <label>Modelo</label>
          <input name="modelo" placeholder="Latitude 5520" oninput="vOpcional(this,'ti-modelo')"
            onblur="vOpcional(this,'ti-modelo')">
          <div class="field-msg" id="msg-ti-modelo"></div>
        </div>
      </div>

      <!-- ─── N° Serie + IMEI ───────────────────────────────── -->
      <div class="grid-2">

        <div class="field">
          <label>Número de serie</label>
          <input name="numero_serie" id="numero_serie" oninput="validarSerieUnica(this)"
            onblur="validarSerieUnica(this)">
          <div class="field-msg" id="msg-ti-serie"></div>
        </div>

        <!-- IMEI -->
        <div class="field" id="campo-imei" style="display:none">
          <label>IMEI</label>
          <input name="imei" placeholder="Solo celulares" oninput="vImei(this)" onblur="vImei(this)">
          <div class="field-msg" id="msg-ti-imei"></div>
        </div>

        <!-- Cargador -->
        <div class="field" id="campo-cargador" style="display:none">
          <label class="requerido">N° de serie del cargador</label>
          <input name="serie_cargador" placeholder="Ej: CHG-DELL-2024-001" oninput="vCampo(this,'ti-cargador')"
            onblur="vCampo(this,'ti-cargador')">
          <div class="invalid-tooltip">
            El número de serie del cargador es obligatorio para laptops.
          </div>
          <div class="field-msg" id="msg-ti-cargador"></div>
        </div>

      </div>

      <!-- ─── Specs técnicas ────────────────────────────────── -->
      <div id="campos-specs">
        <div class="grid-2">
          <div class="field">
            <label>Procesador</label>
            <input name="procesador" placeholder="Ej: Intel i7-12th" oninput="vOpcional(this,'ti-proc')"
              onblur="vOpcional(this,'ti-proc')">
            <div class="field-msg" id="msg-ti-proc"></div>
          </div>
          <div class="field">
            <label>Memoria RAM</label>
            <input name="memoria_ram" placeholder="Ej: 16 GB DDR4" oninput="vOpcional(this,'ti-ram')"
              onblur="vOpcional(this,'ti-ram')">
            <div class="field-msg" id="msg-ti-ram"></div>
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label>Almacenamiento</label>
            <input name="almacenamiento" placeholder="Ej: 512 GB SSD" oninput="vOpcional(this,'ti-alm')"
              onblur="vOpcional(this,'ti-alm')">
            <div class="field-msg" id="msg-ti-alm"></div>
          </div>
          <div class="field">
            <label>Sistema operativo</label>
            <input name="sistema_operativo" placeholder="Ej: Windows 11 Pro" oninput="vOpcional(this,'ti-so')"
              onblur="vOpcional(this,'ti-so')">
            <div class="field-msg" id="msg-ti-so"></div>
          </div>
        </div>
      </div>

      <!-- ─── Costo + Garantía ──────────────────────────────── -->
      <div class="grid-2">
        <div class="field">
          <label>Costo ($)</label>
          <input name="costo" type="number" step="0.01" min="0" placeholder="0.00"
            oninput="vNumero(this,'ti-costo')" onblur="vNumero(this,'ti-costo')">
          <div class="field-msg" id="msg-ti-costo"></div>
        </div>
        <div class="field">
          <label>Garantía (fecha fin)</label>
          <input name="garantia" type="date" onchange="vFechaFutura(this,'ti-garantia')"
            onblur="vFechaFutura(this,'ti-garantia')">
          <div class="field-msg" id="msg-ti-garantia"></div>
        </div>
      </div>

      <!-- ─── Fecha + Ubicación ─────────────────────────────── -->
      <div class="grid-2">
        <div class="field">
          <label>Fecha adquisición</label>
          <input name="fecha_adquisicion" type="date" onchange="vFecha(this,'ti-fecha')"
            onblur="vFecha(this,'ti-fecha')">
          <div class="field-msg" id="msg-ti-fecha"></div>
        </div>
        <div class="field">
          <label>Ubicación</label>
          <select name="ubicacion_id">
            <option value="">— Sin ubicación —</option>
            {% for u in ubicaciones %}
            <option value="{{ u.IdUbicacion }}">{{ u.Nombre }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <!-- ─── Accesorios ────────────────────────────────────── -->
      <div class="field">
        <label>Accesorios</label>
        <input name="accesorios" placeholder="Ej: Cargador, mouse, docking" oninput="vOpcional(this,'ti-acc')"
          onblur="vOpcional(this,'ti-acc')">
        <div class="field-msg" id="msg-ti-acc"></div>
      </div>

      <!-- ─── Arrendamiento ─────────────────────────────────── -->
      <div class="grid-2">
        <div class="field">
          <label style="display:inline-flex;align-items:stretch;gap:15px;cursor:pointer">
            <input type="checkbox" name="arrendamiento" value="1" onchange="toggleArrendamiento(this)">
            ¿Es arrendado?
          </label>
        </div>
      </div>
      <div id="campos-arrendamiento" style="display:none">
        <div class="grid-2">
          <div class="field">
            <label>Fecha de renovación</label>
            <input name="fecha_renovacion" type="date" onchange="vFechaFutura(this,'ti-renov')"
              onblur="vFechaFutura(this,'ti-renov')">
            <div class="field-msg" id="msg-ti-renov"></div>
          </div>
          <div class="field">
            <label>Proveedor</label>
            <input name="proveedor_arrendamiento" placeholder="Nombre del proveedor"
              oninput="vOpcional(this,'ti-prov')" onblur="vOpcional(this,'ti-prov')">
            <div class="field-msg" id="msg-ti-prov"></div>
          </div>
        </div>
      </div>

      <!-- ─── Comentarios ───────────────────────────────────── -->
      <div class="field">
        <label>Comentarios</label>
        <textarea name="comentarios" placeholder="Notas adicionales..." oninput="vOpcional(this,'ti-com')"
          onblur="vOpcional(this,'ti-com')"></textarea>
        <div class="field-msg" id="msg-ti-com"></div>
      </div>

      <!-- ─── Archivos ──────────────────────────────────────── -->
      <div class="grid-2">
        <div class="field">
          <label>Hoja de asignación</label>
          <input type="file" id="input-facturas" name="factura"
                 accept=".pdf,.doc,.docx" multiple
                 style="color:var(--text);font-size:13px"
                 onchange="agregarArchivos(this, 'lista-facturas', 'documentos')">
          <div id="lista-facturas" class="lista-archivos"></div>
        </div>

        <div class="field">
          <label>Evidencia fotográfica (opcional)</label>
          <input type="file" id="input-evidencias" name="evidencia"
                 accept=".png,.jpg,.jpeg" multiple
                 style="color:var(--text);font-size:13px"
                 onchange="agregarArchivos(this, 'lista-evidencias', 'imagenes')">
          <div id="lista-evidencias" class="lista-archivos"></div>
        </div>
      </div>

      <!-- ─── Botones ───────────────────────────────────────── -->
      <div class="modal-footer">
        <button type="button" class="btn-cancel" onclick="cerrarModal('modal-nuevo')">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="submitEquipo()">
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
