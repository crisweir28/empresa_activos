<!-- app/templates/cambiar_password.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cambiar contraseña — ActivosApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <style>
    .seccion { background:#fafafa; border:1.5px solid #e4e4e7; border-radius:12px; padding:18px; margin-bottom:16px; }
    .seccion-titulo { font-size:12px; font-weight:700; color:#71717a; text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px; }
    .input-row { display:flex; gap:8px; }
    .btn-generar { padding:10px 16px; background:linear-gradient(135deg,#9B2335,#c0392b); color:#fff; border:none; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; font-family:'Inter',sans-serif; }
    .btn-generar:hover { opacity:.9; }
    .sugerida-box { display:none; margin-top:14px; background:#fff; border:1.5px solid #e4e4e7; border-radius:10px; padding:14px; }
    .sugerida-box.visible { display:block; animation:fadeIn .3s ease; }
    .sugerida-label { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:#a1a1aa; font-weight:600; margin-bottom:4px; }
    .sugerida-valor { font-size:20px; font-weight:800; color:#18181b; font-family:'Plus Jakarta Sans',sans-serif; letter-spacing:.05em; margin-bottom:8px; word-break:break-all; }
    .sugerida-len   { font-size:12px; color:#71717a; margin-bottom:8px; }
    .strength-bar   { height:5px; background:#e4e4e7; border-radius:5px; overflow:hidden; }
    .strength-fill  { height:100%; border-radius:5px; transition:width .3s,background .3s; }
    .strength-label { font-size:11px; color:#71717a; margin-top:4px; }
    .sugerida-btns  { display:flex; gap:8px; margin-top:12px; }
    .btn-usar  { flex:1; padding:8px; background:#9B2335; color:#fff; border:none; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; }
    .btn-otra  { flex:1; padding:8px; background:white; color:#71717a; border:1.5px solid #e4e4e7; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; }
    .divisor   { text-align:center; font-size:12px; color:#a1a1aa; margin:16px 0; position:relative; }
    .divisor::before, .divisor::after { content:''; position:absolute; top:50%; width:40%; height:1px; background:#e4e4e7; }
    .divisor::before { left:0; } .divisor::after { right:0; }
    .pass-input-wrap { position:relative; }
    .pass-input-wrap input { padding-right:70px; }
    .pass-icons { position:absolute; right:10px; top:50%; transform:translateY(-50%); display:flex; gap:4px; }
    .icon-btn   { background:none; border:none; cursor:pointer; font-size:14px; padding:3px; color:#a1a1aa; }
    .icon-btn:hover { color:#18181b; }
    .btn-guardar { width:100%; padding:12px; background:linear-gradient(135deg,#9B2335,#c0392b); color:#fff; border:none; border-radius:11px; font-size:14px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; margin-top:8px; transition:all .15s; }
    .btn-guardar:disabled { opacity:.45; cursor:not-allowed; }
    .btn-guardar:not(:disabled):hover { opacity:.9; transform:translateY(-1px); }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none} }
  </style>
</head>
<body>
  <div class="geo-circle-1"></div>
  <div class="geo-circle-2"></div>
  <div class="geo-circle-3"></div>

  <div class="auth-wrap" style="max-width:480px">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon">🏢</div>
        <span class="auth-logo-text">ActivosApp</span>
      </div>

      <h1 class="auth-title">Nueva contraseña</h1>
      <p class="auth-sub">Escribe una frase y generamos una contraseña segura, o ingresa la tuya directamente.</p>

      {% if error %}<div class="flash flash-error">⚠️ {{ error }}</div>{% endif %}

      <!-- Generar desde frase -->
      <div class="seccion">
        <div class="seccion-titulo">✨ Generar desde una frase</div>
        <div class="input-row">
          <input type="text" id="frase-input" placeholder="Ej: comediante, cuandollovera"
                 style="flex:1;padding:10px 14px;background:#fafafa;border:1.5px solid #e4e4e7;border-radius:9px;color:#18181b;font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:all .15s"
                 onfocus="this.style.borderColor='#9B2335';this.style.boxShadow='0 0 0 3px rgba(155,35,53,.1)'"
                 onblur="this.style.borderColor='#e4e4e7';this.style.boxShadow='none'">
          <button type="button" class="btn-generar" onclick="generarSugerida()">✨ Generar</button>
        </div>
        <div class="sugerida-box" id="sugerida-box">
          <div class="sugerida-label">Contraseña sugerida</div>
          <div class="sugerida-valor" id="sugerida-valor"></div>
          <div class="sugerida-label">Guárdala en un lugar seguro</div>
          <div class="sugerida-len" id="sugerida-len"></div>
          <div class="strength-bar"><div class="strength-fill" id="sug-fill"></div></div>
          <div class="sugerida-btns">
            <button type="button" class="btn-usar" onclick="usarSugerida()">✅ Usar esta</button>
            <button type="button" class="btn-otra" onclick="generarSugerida()">🔄 Generar otra</button>
          </div>
        </div>
      </div>

      <div class="divisor">o escribe la tuya directamente</div>

      <form method="POST" action="{{ url_for('auth.cambiar_password') }}" id="form-guardar">
        <div class="field">
          <label>Nueva contraseña</label>
          <div class="pass-input-wrap">
            <input type="password" name="nueva_password" id="nueva"
                   placeholder="Mínimo 6 caracteres" autocomplete="new-password"
                   oninput="analizarManual(this.value)">
            <div class="pass-icons">
              <button type="button" class="icon-btn" onclick="limpiar()" title="Limpiar">✕</button>
              <button type="button" class="icon-btn" onclick="toggleVer('nueva',this)" title="Ver">👁</button>
            </div>
          </div>
          <div id="manual-strength" style="display:none;margin-top:8px">
            <div class="strength-bar"><div class="strength-fill" id="man-fill"></div></div>
            <div class="strength-label" id="man-nivel"></div>
          </div>
        </div>
        <div class="field">
          <label>Confirmar contraseña</label>
          <div class="pass-input-wrap">
            <input type="password" name="confirmar_password" id="confirmar"
                   placeholder="Repite la contraseña" autocomplete="new-password"
                   oninput="validarBtn()">
            <div class="pass-icons">
              <button type="button" class="icon-btn" onclick="toggleVer('confirmar',this)" title="Ver">👁</button>
            </div>
          </div>
        </div>
        <button type="submit" class="btn-guardar" id="btn-guardar" disabled>Guardar contraseña →</button>
      </form>

      <div class="auth-link" style="margin-top:16px">
        <a href="{{ url_for('auth.login') }}">← Volver al login</a>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/cambiar_password.js') }}"></script>
</body>
</html>
