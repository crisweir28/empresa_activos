<!-- app/templates/sugerir_cambio.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bienvenido — ActivosApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <style>
    .emoji-big { font-size: 52px; display:block; text-align:center; margin-bottom:16px; }
    .btns-stack { display:flex; flex-direction:column; gap:10px; margin-top:24px; }
    .btn-secondary {
      width:100%; padding:12px;
      background:white; color:#3f3f46;
      border:1.5px solid #e4e4e7; border-radius:11px;
      font-family:'Inter',sans-serif; font-size:14px; font-weight:600;
      cursor:pointer; transition:all .15s;
    }
    .btn-secondary:hover { background:#fafafa; border-color:#d1d1d6; }
    .hint { font-size:12px; color:#a1a1aa; text-align:center; margin-top:16px; line-height:1.6; }
  </style>
</head>
<body>
  <div class="geo-circle-1"></div>
  <div class="geo-circle-2"></div>
  <div class="geo-circle-3"></div>

  <div class="auth-wrap">
    <div class="auth-card" style="text-align:center">
      <div class="auth-logo" style="justify-content:center">
        <div class="auth-logo-icon">🏢</div>
        <span class="auth-logo-text">ActivosApp</span>
      </div>

      <span class="emoji-big">🔐</span>
      <h1 class="auth-title" style="text-align:center">
        Bienvenido, {{ current_user.nombre.split()[0] }}
      </h1>
      <p class="auth-sub" style="text-align:center">
        Iniciaste sesión con una contraseña temporal.<br>
        ¿Te gustaría <strong style="color:#18181b">crear tu propia contraseña</strong> ahora?
      </p>

      <form method="POST" class="btns-stack">
        <button type="submit" name="decision" value="si" class="btn-auth">
          ✅ Sí, quiero cambiarla
        </button>
        <button type="submit" name="decision" value="no" class="btn-secondary">
          Ahora no, entrar al sistema
        </button>
      </form>

      <p class="hint">
        Si eliges "ahora no", podrás cambiarla después desde tu perfil.<br>
        Te recomendamos cambiarla por seguridad.
      </p>
    </div>
  </div>
</body>
</html>
