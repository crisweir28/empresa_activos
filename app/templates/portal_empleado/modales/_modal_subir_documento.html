<!-- app/templates/portal_empleado/modales/_modal_subir_documento.html -->
<div class="modal" id="modal-subir-doc">
  <div class="modal-content" style="max-width:500px">
    <div class="modal-header">
      <h3>📄 Subir Documento Personal</h3>
      <button class="modal-close" onclick="cerrarModal('modal-subir-doc')">&times;</button>
    </div>
    
    <form method="POST" action="{{ url_for('portal.subir_documento') }}" enctype="multipart/form-data">
      <div class="modal-body">
        
        <div class="form-group">
          <label for="tipo_documento">Tipo de Documento *</label>
          <select name="tipo_documento" id="tipo_documento" required>
            <option value="">Seleccionar...</option>
            <option value="licencia_conducir">📜 Licencia de Conducir</option>
            <option value="ine">🆔 INE / Credencial de Elector</option>
            <option value="examen_medico">🩺 Examen Médico</option>
            <option value="comprobante_domicilio">🏠 Comprobante de Domicilio</option>
            <option value="curp">📋 CURP</option>
            <option value="rfc">💼 RFC</option>
            <option value="nss">🏥 NSS (Número de Seguridad Social)</option>
            <option value="carta_antecedentes">✅ Carta de Antecedentes No Penales</option>
            <option value="otro">📄 Otro</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="numero_documento">Número de Documento</label>
          <input type="text" name="numero_documento" id="numero_documento" 
                 placeholder="Ej: LIC-123456, INE-789012">
        </div>
        
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="form-group">
            <label for="fecha_emision">Fecha de Emisión</label>
            <input type="date" name="fecha_emision" id="fecha_emision">
          </div>
          
          <div class="form-group">
            <label for="fecha_vencimiento">Fecha de Vencimiento</label>
            <input type="date" name="fecha_vencimiento" id="fecha_vencimiento">
          </div>
        </div>
        
        <div class="form-group">
          <label for="archivo">Archivo (PDF, JPG, PNG) *</label>
          <input type="file" name="archivo" id="archivo" 
                 accept=".pdf,.jpg,.jpeg,.png" required>
          <small style="color:var(--muted);font-size:11px;display:block;margin-top:4px">
            Formatos permitidos: PDF, JPG, PNG. Tamaño máximo: 10MB
          </small>
        </div>
        
        <div class="form-group">
          <label for="descripcion">Observaciones (opcional)</label>
          <textarea name="descripcion" id="descripcion" rows="2" 
                    placeholder="Notas adicionales sobre este documento"></textarea>
        </div>
        
      </div>
      
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" 
                onclick="cerrarModal('modal-subir-doc')">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary">
          📤 Subir Documento
        </button>
      </div>
    </form>
  </div>
</div>
