<div class="overlay" id="modal-editar" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="modal" onclick="event.stopPropagation()">
        <h2>✏️ Editar usuario</h2>
        <form method="POST" id="form-editar">
            <div class="grid-2">
                <div class="field">
                    <label>Nombre *</label>
                    <input id="e-nombre" name="nombre" required
                        oninput="soloLetras(this); validarCampo(this,'e-nombre')"
                        onblur="validarCampo(this,'e-nombre')">
                    <div class="field-msg" id="msg-e-nombre"></div>
                </div>
                <div class="field">
                    <label>Apellido paterno *</label>
                    <input id="e-ap" name="apellido_paterno" required
                        oninput="soloLetras(this); validarCampo(this,'e-ap')" onblur="validarCampo(this,'e-ap')">
                    <div class="field-msg" id="msg-e-ap"></div>
                </div>
            </div>
            <div class="grid-2">
                <div class="field">
                    <label>Apellido materno *</label>
                    <input id="e-am" name="apellido_materno" required
                        oninput="soloLetras(this); validarCampo(this,'e-am')" onblur="validarCampo(this,'e-am')">
                    <div class="field-msg" id="msg-e-am"></div>
                </div>
                <div class="field">
                    <label>Teléfono *</label>
                    <input id="e-tel" name="telefono" required oninput="soloNumeros(this); validarCampo(this,'e-tel')"
                        onblur="validarCampo(this,'e-tel')">
                    <div class="field-msg" id="msg-e-tel"></div>
                </div>
            </div>
            <div class="grid-2">
                <div class="field">
                    <label>Usuario *</label>
                    <input id="e-user" name="username" required oninput="validarCampo(this,'e-user')"
                        onblur="validarCampo(this,'e-user')">
                    <div class="field-msg" id="msg-e-user"></div>
                </div>
                <div class="field">
                    <label>Correo *</label>
                    <input id="e-correo" name="correo" type="email" required oninput="validarCampo(this,'e-correo')"
                        onblur="validarCampo(this,'e-correo')">
                    <div class="field-msg" id="msg-e-correo"></div>
                </div>
            </div>
            {% if current_user.IdRol == 1 %}
            <div class="grid-2">
                <div class="field"><label>Área</label>
                    <select id="e-depto" name="departamento_id">
                        <option value="">— Sin área (Super Admin) —</option>
                        {% for d in departamentos %}
                        <option value="{{ d.id }}">
                            {% if d.nombre in areas_modulo %}🏢{% else %}👤{% endif %} {{ d.nombre }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="field"><label>Tipo</label>
                    <select id="e-tipo" name="tipo_usuario">
                        <option value="empleado">👤 Empleado</option>
                        <option value="administrador">⭐ Administrador del área</option>
                    </select>
                </div>
            </div>
            <input type="hidden" id="e-rol" name="rol_id">
            {% endif %}
            <div class="field"><label>Estatus</label>
                <select id="e-estatus" name="estatus">
                    <option value="1">Activo</option>
                    <option value="0">Inactivo</option>
                </select>
            </div>
            <div class="field" style="margin-top:8px">
                <label>Nueva contraseña <span style="color:var(--muted);font-weight:400;font-size:11px">(dejar vacío
                        para no cambiar)</span></label>
                <input id="e-pass" name="nueva_password" type="password" placeholder="Mínimo 6 caracteres"
                    autocomplete="new-password" oninput="validarCampo(this,'e-pass')"
                    onblur="validarCampo(this,'e-pass')">
                <div class="field-msg" id="msg-e-pass"></div>
            </div>
            {% if current_user.IdRol == 1 %}
            <div id="panel-bloqueado" style="display:none;background:#fff5f5;border:1px solid #fca5a5;
                  border-radius:8px;padding:12px 16px;margin-top:8px;
                  align-items:center;justify-content:space-between;gap:12px">
                <div style="font-size:13px;color:#b91c1c">
                    🔒 Esta cuenta está <strong>bloqueada</strong> por múltiples intentos fallidos.
                </div>
                <button type="button" class="btn-sm"
                    style="background:#f59e0b;color:#fff;border-color:#f59e0b;white-space:nowrap;flex-shrink:0"
                    onclick="desbloquearConfirm()">
                    🔓 Desbloquear
                </button>
            </div>
            {% endif %}
            <div class="modal-footer">
                <button type="button" class="btn-cancel"
                    onclick="document.getElementById('modal-editar').classList.remove('open')">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="submitValidado('form-editar')">Guardar
                    cambios</button>
            </div>
        </form>
    </div>
</div>
