<!-- Modal: Reporte de daño -->
<div class="overlay" id="modal-reporte" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal" onclick="event.stopPropagation()">
    <h2>⚠️ Reporte de daño / faltante</h2>
    <form method="POST"
          action="{{ url_for('almacenista.reporte_danio', id=herramienta.IdHerramienta) }}"
          enctype="multipart/form-data">
      <div class="field"><label>Tipo de reporte</label>
        <select name="tipo">
          <option value="daño">Daño</option>
          <option value="faltante">Faltante</option>
          <option value="perdido">Perdido</option>
        </select>
      </div>
      <div class="field"><label>Nombre del material *</label>
        <input name="nombre_material" value="{{ herramienta.Nombre }}" required>
      </div>
      <div class="field"><label>Característica del daño *</label>
        <textarea name="caracteristica" placeholder="Describe el daño o faltante..." required></textarea>
      </div>
      <div class="field"><label>Razón *</label>
        <textarea name="razon" placeholder="¿Por qué ocurrió?" required></textarea>
      </div>
      <div class="field"><label>Usuario responsable</label>
        <select name="responsable_id">
          <option value="">— Sin responsable —</option>
          {% for u in usuarios %}
          <option value="{{ u.IdUsuario }}">{{ u.Nombre }} {{ u.ApellidoPaterno }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="field">
        <label>Adjuntar documento / evidencia (opcional)</label>
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px;overflow-x:auto">
          PDF, Word, Excel, PowerPoint · o imagen PNG/JPG
        </div>
        <input type="file" name="archivo"
               accept=".png,.jpg,.jpeg,.gif,.webp,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv"
               onchange="previewAdjunto(this)"
               style="color:var(--text);font-size:13px">
      </div>
      <div id="adjunto-preview" style="display:none;margin-top:8px;
           background:var(--surface2);border-radius:8px;padding:12px;
           align-items:center;gap:10px">
        <span id="adjunto-icono" style="font-size:28px"></span>
        <div>
          <div id="adjunto-nombre" style="font-size:13px;font-weight:600"></div>
          <div id="adjunto-size"   style="font-size:11px;color:var(--muted)"></div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel"
                onclick="document.getElementById('modal-reporte').classList.remove('open')">Cancelar</button>
        <button type="submit" class="btn btn-primary"
                style="background:linear-gradient(135deg,var(--red),#fb923c)">Guardar reporte</button>
      </div>
    </form>
  </div>
</div>
