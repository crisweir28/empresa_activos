<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nueva contraseña — ActivosApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <div class="card">
    <div class="logo">
      <div class="logo-icon">🏢</div>
      <span class="logo-text">ActivosApp</span>
    </div>
    <h1>Crea tu contraseña</h1>
    <p class="sub">Escribe una frase y generamos una contraseña segura, o ingresa la tuya directamente.</p>

    {% if error %}<div class="error-box">⚠️ {{ error }}</div>{% endif %}

    <!-- Generar desde frase -->
    <div class="seccion">
      <div class="seccion-titulo">✨ Generar desde una frase</div>
      <div class="input-row">
        <input type="text" id="frase-input"
               placeholder="Ej: comediante, cuandollovera"
               style="flex:1;padding:10px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .2s"
               onfocus="this.style.borderColor='var(--accent)'"
               onblur="this.style.borderColor='var(--border)'">
        <button type="button" class="btn-generar" onclick="generarSugerida()">
          ✨ Generar
        </button>
      </div>

      <div class="sugerida-box" id="sugerida-box">
        <div class="sugerida-inner">
          <div class="sugerida-label">Contraseña sugerida</div>
          <div class="sugerida-valor" id="sugerida-valor"></div>
          <div class="sugerida-label">Se recomienda guardarla en un lugar seguro</div>
          <div class="sugerida-len"   id="sugerida-len"></div>
          <div class="strength-wrap">

            <div class="strength-bar"><div class="strength-fill" id="sug-fill"></div></div>
          </div>
          <div class="sugerida-btns">
            <button type="button" class="btn-usar" onclick="usarSugerida()">✅ Usar esta</button>
            <button type="button" class="btn-otra" onclick="generarSugerida()">🔄 Generar otra</button>
          </div>
        </div>
      </div>
    </div>

    <div class="divisor">o escribe la tuya directamente</div>

    <!-- Form manual -->
    <form method="POST" action="{{ url_for('auth.cambiar_password') }}" id="form-guardar">
      <input type="hidden" name="accion" value="guardar">

      <div class="field">
        <label>Nueva contraseña</label>
        <div class="pass-input-wrap">
          <input type="password" name="nueva_password" id="nueva"
                 placeholder="Mínimo 6 caracteres"
                 autocomplete="new-password"
                 oninput="analizarManual(this.value)">
          <div class="pass-icons">
            <button type="button" class="icon-btn" onclick="limpiar()" title="Limpiar">✕</button>
            <button type="button" class="icon-btn" onclick="toggleVer('nueva',this)" title="Ver">👁</button>
          </div>
        </div>
        <div id="manual-strength" style="display:none">
          <div class="strength-bar" style="margin-top:8px">
            <div class="strength-fill" id="man-fill"></div>
          </div>
          <div class="strength-label" id="man-nivel"></div>
        </div>
      </div>

      <div class="field">
        <label>Confirmar contraseña</label>
        <div class="pass-input-wrap">
          <input type="password" name="confirmar_password" id="confirmar"
                 placeholder="Repite la contraseña"
                 autocomplete="new-password"
                 oninput="validarBtn()">
          <div class="pass-icons">
            <button type="button" class="icon-btn" onclick="toggleVer('confirmar',this)" title="Ver">👁</button>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-guardar" id="btn-guardar" disabled>
        Guardar contraseña →
      </button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='js/cambiar_password.js') }}"></script>
</body>
</html>
