<!-- app/templates/login.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Iniciar sesión — ActivosApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
  <!-- Círculos decorativos -->
  <div class="geo-circle-1"></div>
  <div class="geo-circle-2"></div>
  <div class="geo-circle-3"></div>

  <div class="auth-wrap">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <div class="auth-logo-icon">🏢</div>
        <span class="auth-logo-text">ActivosApp</span>
      </div>

      <h1 class="auth-title">Bienvenido</h1>
      <p class="auth-sub">Inicia sesión para gestionar los activos.</p>

      {% with messages = get_flashed_messages(with_categories=True) %}
        {% for cat, msg in messages %}
          <div class="flash flash-{{ cat }}">⚠️ {{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST">
        <div class="field">
          <label>Usuario</label>
          <input type="text" name="username" placeholder="tu_usuario"
                 autocomplete="username" required>
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" name="password" placeholder="••••••••"
                 autocomplete="current-password" required>
        </div>

        <label class="remember" style="margin-bottom:16px">
          <input type="checkbox" name="remember">
          Mantener sesión
        </label>

        <button class="btn-auth" type="submit">Entrar →</button>
      </form>

      <div class="auth-link">
        <a href="{{ url_for('auth.recuperar') }}">¿Olvidaste tu contraseña?</a>
      </div>

    </div>
  </div>
</body>
</html>
